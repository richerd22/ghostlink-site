<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GHOST LINK · SEE IT LIVE</title>
<meta name="description" content="The real GHOST LINK dashboard, running on made-up decks. No box needed.">
<link rel="icon" href="../icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icon-180.png">
<style>
@font-face { font-family: "JetBrains Mono"; src: url(../JetBrainsMono_600SemiBold.ttf); font-weight: 600; font-display: swap; }
html, body { margin: 0; height: 100%; background: #000; color: #fff; }
body { display: flex; flex-direction: column; font: 600 12px/1 "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: .1em; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 16px; height: 44px; border-bottom: 1px solid #222; flex: 0 0 auto; }
.bar a { color: #9a9a9a; text-decoration: none; }
.bar a:hover, .bar a:focus-visible { color: #fff; }
.bar span { color: #9a9a9a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
iframe { flex: 1 1 auto; width: 100%; border: 0; display: block; background: #000; }
.framed .bar { display: none; }
</style>
</head>
<body>
<!-- SEE IT LIVE: the real dashboard (dash.html, copied from the box's files by bin/site) on made-up decks. -->
<div class="bar"><a href="../">&larr; GHOST LINK</a><span>DEMO · MADE-UP DECKS</span></div>
<iframe id="dash" title="GHOST LINK dashboard demo, made-up decks"></iframe>
<script>
(function () {
  if (window.top !== window) document.documentElement.className = 'framed';
  var q = new URLSearchParams(location.search), hash = location.hash; // no tab in the address = DECKS (a #tab here would scroll the home page to the frame)
  var extra = q.has('layout') ? '&layout=' + encodeURIComponent(q.get('layout')) : '';
  document.getElementById('dash').src = 'dash.html?demo=1&notour' + extra + hash;
})();
</script>
</body>
</html>
