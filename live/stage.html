<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHOST LINK STAGE CLOCK</title>
<meta name="robots" content="noindex">
<script src="shim.js"></script>
<script>/* #128 ?rotate=90|180|270 for a screen mounted sideways or upside down (before the first paint) */
var StageRotate = (location.search.match(/[?&]rotate=(90|180|270)\b/) || [0, '0'])[1];
document.documentElement.className = 'rot-' + StageRotate;
/* #131 NEXT UP: the crowd's view of the clock lives in its own page */
if (/[?&]view=crowd\b/.test(location.search)) location.replace('crowd.html' + location.search);</script>
<style>
/* STAGE CLOCK (#124): for an LED wall or a lip-of-stage monitor, read from 10 m away. The set's time left and end
   time, who's on and who's next, the changeover, overtime, the time of day, WRAP-UP CALLS. Sized from the screen
   (landscape and portrait). Colour carries the state and the words say it too. No track titles.
   #128: everything is sized from the .stage box (container units), so ?rotate=90 / 270 just turns that box and the
   layout follows the screen as it's mounted; other crew calls show small, wrap-up calls stay big. */
@font-face { font-family: "JetBrains Mono"; src: url(../JetBrainsMono_400Regular.ttf); font-weight: 400; }
@font-face { font-family: "JetBrains Mono"; src: url(../JetBrainsMono_600SemiBold.ttf); font-weight: 600; }
:root { --bg: #000; --fg: #fff; --grey: #9a9a9a; --line: #2a2a2a; --air: #ff2a2a; --warn: #ffb000; --tone: var(--fg); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; cursor: none; }
body { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.stage { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; container: stage / size; }
html.rot-90 .stage, html.rot-270 .stage { width: 100vh; height: 100vw; transform-origin: 0 0; }
html.rot-90 .stage { transform: translateX(100vw) rotate(90deg); }
html.rot-270 .stage { transform: translateY(100vh) rotate(270deg); }
html.rot-180 .stage { transform: rotate(180deg); }
.wrap { height: 100cqh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto auto auto; padding: 3cqh 4cqw; gap: 2cqh; }
body.amber, body.hold { --tone: var(--warn); } /* #127 HOLD: calm amber, never pulsing */
body.red, body.pulse, body.over { --tone: var(--air); }
body:not(.normal) .wrap { box-shadow: inset 0 0 0 1.2cqmin var(--tone); }
.top { display: flex; align-items: center; gap: 2cqw; color: var(--grey); font-size: 2.6cqh; letter-spacing: .14em; }
.top pre { margin: 0; font-size: 1.2cqh; line-height: 1.2cqh; color: var(--fg); }
.top .sp { flex: 1; }
.top .tod { color: var(--fg); font-size: 7cqh; font-weight: 600; letter-spacing: 0; }
.top .lost { color: var(--warn); }
.mid { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; min-height: 0; }
.mid small { display: flex; gap: 2cqw; align-items: baseline; color: var(--grey); font-size: 4cqh; letter-spacing: .14em; }
.mid small b { color: var(--tone); font-weight: 600; }
.big { display: block; font-weight: 600; line-height: .95; color: var(--tone); white-space: nowrap; }
body.pulse .big { animation: pulse 2s ease-in-out infinite; } /* one slow dim every 2 s: never a strobe */
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { body.pulse .big { animation: none; } }
.sub { font-size: min(10cqh, 8.6cqw); font-weight: 600; line-height: 1.1; color: var(--fg); }
.mid a { color: var(--fg); font-size: 3.4cqh; margin-top: 2cqh; letter-spacing: .06em; }
.banner { display: flex; gap: 3cqw; justify-content: center; align-items: baseline; padding: 1.6cqh 3cqw; font-size: 9cqh; font-weight: 600; border: .8cqmin solid var(--warn); color: var(--warn); white-space: nowrap; overflow: hidden; }
.banner.go { background: var(--air); border-color: var(--air); color: var(--bg); }
/* #128 other crew calls: one small line each, never as big as a wrap-up call */
.calls { display: grid; gap: .6cqh; }
.calls div { display: flex; gap: 2cqw; align-items: baseline; font-size: 3.4cqh; letter-spacing: .06em; color: var(--warn); white-space: nowrap; overflow: hidden; }
.calls div small { color: var(--grey); font-size: 2.4cqh; letter-spacing: .14em; flex: 0 0 auto; }
.calls div span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.calls div b { flex: 0 0 auto; font-weight: 600; }
.calls div.go b { color: var(--air); }
/* #131 WEATHER's small line (top) and the next act's SET NOTE (last 15 min + changeover) */
.wrap { grid-template-columns: minmax(0, 1fr); }
.top .wx { color: var(--fg); font-size: 3cqh; letter-spacing: .06em; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.setnote { font-size: min(5cqh, 3.1cqw); font-weight: 600; line-height: 1.15; color: var(--fg); border-left: 1cqmin solid var(--warn); padding: .4cqh 0 .4cqh 2cqw;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.foot { display: grid; grid-template-columns: 1fr 1fr; gap: 4cqw; border-top: 2px solid var(--line); padding-top: 2cqh; }
.foot small { display: block; color: var(--grey); font-size: 3cqh; letter-spacing: .14em; }
.foot b { display: block; font-size: 8cqh; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.foot span { font-size: 4cqh; color: var(--grey); }
.foot .nx { text-align: right; }
@container stage (orientation: portrait) {
  .wrap { padding: 3cqh 5cqw; }
  .top .tod { font-size: 4.5cqh; }
  .top .name { display: none; }
  .mid small { font-size: 2.6cqh; }
  .sub { font-size: min(5.6cqh, 8.6cqw); }
  .mid a { font-size: 2.2cqh; }
  .banner { font-size: 5cqh; flex-wrap: wrap; }
  .calls div { font-size: 2.4cqh; }
  .calls div small { font-size: 1.8cqh; }
  .calls div, .calls div span { white-space: normal; overflow: visible; }
  .top .wx { font-size: min(1.8cqh, 3.2cqw); white-space: normal; text-align: right; flex: 0 1 auto; }
  .setnote { font-size: min(3cqh, 4.6cqw); -webkit-line-clamp: 3; }
  .foot { grid-template-columns: 1fr; gap: 2cqh; }
  .foot .nx { text-align: left; }
  .foot b { font-size: 6cqh; }
  .foot small { font-size: 2cqh; }
  .foot span { font-size: 2.8cqh; }
}
[hidden] { display: none !important; }
</style>
</head>
<body class="normal">
<div class="stage" id="stage">
<div class="wrap">
  <div class="top"><pre aria-hidden="true">  .--.
 / oo \
|      |
|      |
 \/\/\/</pre><span class="name">GHOST LINK · STAGE CLOCK</span><span class="sp"></span><span class="wx" id="wx" hidden></span><span class="lost" id="lost" hidden>NO BOX</span><b class="tod" id="tod"></b></div>
  <div class="mid">
    <small><span id="label"></span><b id="word"></b></small>
    <b class="big" id="big"></b>
    <span class="sub" id="sub"></span>
    <a id="setLink" href="/#status/nights" hidden>SET THEM ON THE DASHBOARD: NIGHTS → PLAN A NIGHT</a>
  </div>
  <div class="banner" id="banner" hidden><span id="bText"></span><span id="bTime"></span></div>
  <div class="calls" id="calls" hidden></div>
  <div class="setnote" id="setNote" hidden></div>
  <div class="foot" id="foot">
    <div><small>ON NOW</small><b id="onNow">--</b></div>
    <div class="nx"><small>NEXT</small><b id="next">--</b><span id="nextSub"></span></div>
  </div>
</div>
</div>
<script src="stageclock.js"></script>
<script>
'use strict';
// Text nodes only: DJ names and calls come from the network.
const $ = id => document.getElementById(id);
const set = (id, v) => { const e = $(id); if (e.textContent !== v) e.textContent = v; };
document.addEventListener('click', () => {
  document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
  navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {});
});
// #128 R turns the clock a quarter (a keyboard on the screen's computer); the address keeps it for a bookmark.
document.addEventListener('keydown', e => {
  if (e.key !== 'r' && e.key !== 'R') return;
  const next = StageClockView.nextRotation(StageRotate);
  StageRotate = String(next);
  document.documentElement.className = 'rot-' + next;
  const q = new URLSearchParams(location.search);
  if (next) q.set('rotate', next); else q.delete('rotate');
  history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
  sizeKey = '';
  draw();
});
let feed = null, skew = 0, heardAt = 0;
async function load() {
  const t0 = Date.now();
  try {
    const r = await fetch('/api/stageclock', { cache: 'no-store' });
    if (!r.ok) return;
    const f = await r.json(), t1 = Date.now();
    skew = (t0 + t1) / 2 - f.at; // the box's clock = Date.now() - skew
    feed = f; heardAt = t1;
  } catch (e) { /* keep counting from the last reading */ }
}
load(); setInterval(load, 1000);
let sizeKey = '', callsSig = '';
function draw() {
  const now = Date.now() - skew, v = StageClockView.view(feed, now);
  const cls = v.tone + ' s-' + v.state.toLowerCase();
  if (document.body.className !== cls) document.body.className = cls;
  set('tod', StageClockView.clock(now));
  set('label', v.label); set('word', v.word); set('big', v.big); set('sub', v.sub);
  $('sub').hidden = !v.sub;
  $('setLink').hidden = !v.link;
  set('onNow', v.onNow || '--'); set('next', v.next || '--'); set('nextSub', v.nextSub);
  $('foot').hidden = v.state === 'DONE' || (v.state === 'NONE' && !v.onNow);
  $('banner').hidden = !v.banner;
  if (v.banner) { set('bText', v.banner.text); set('bTime', v.banner.time); $('banner').classList.toggle('go', v.banner.go); }
  // #128 other crew calls, small
  const calls = StageClockView.calls(feed, now), sig = JSON.stringify(calls);
  if (sig !== callsSig) {
    callsSig = sig;
    const box = $('calls');
    box.replaceChildren(...calls.map(c => {
      const row = document.createElement('div');
      if (c.go) row.className = 'go';
      const a = document.createElement('small'); a.textContent = c.from || 'CREW';
      const t = document.createElement('span'); t.textContent = c.text;
      const w = document.createElement('b'); w.textContent = c.time;
      row.append(a, t, w);
      return row;
    }));
    box.hidden = !calls.length;
  }
  // #131 WEATHER's line and the next act's SET NOTE (text nodes only)
  const wx = StageClockView.weatherLine(feed), nt = StageClockView.noteLine(feed, now);
  set('wx', wx); $('wx').hidden = !wx;
  set('setNote', nt); $('setNote').hidden = !nt;
  $('lost').hidden = !feed || Date.now() - heardAt < 10000;
  const st = $('stage'), W = st.clientWidth, H = st.clientHeight; // the screen as it's mounted (#128 rotate)
  const mo = document.querySelector('.mo-stage:not([hidden])'); // #140: the MOMENTS line (#135) takes room too
  const k = v.big.length + 'x' + W + 'x' + H + (v.banner ? 'b' : '') + (calls.length || '') + (nt ? 'n' : '') + (mo ? 'm' : '');
  if (k !== sizeKey) { // the digits as big as fit, a little less while a banner or calls are up
    sizeKey = k;
    $('big').style.fontSize = Math.floor(StageClockView.bigSize(v.big, W, H) * (v.banner ? 0.85 : 1) * (calls.length ? 1 - 0.06 * calls.length : 1) * (nt ? 0.85 : 1)) + 'px';
    // #140: with a wrap-up call, a moment and the next act's note all up, the time could spill over the label and
    // the banner (seen on the demo): shrink it and the end time under it, the time staying the biggest, until the
    // middle holds them.
    const mid = document.querySelector('.mid'), big = $('big'), sub = $('sub');
    sub.style.fontSize = '';
    let fs = parseFloat(big.style.fontSize), ss = parseFloat(getComputedStyle(sub).fontSize);
    for (let i = 0; i < 30 && mid.scrollHeight > mid.clientHeight + 1 && fs > 24; i++) {
      big.style.fontSize = (fs = Math.floor(fs * 0.92)) + 'px';
      if (ss > fs * 0.4) sub.style.fontSize = (ss = Math.floor(Math.max(fs * 0.4, ss * 0.88))) + 'px';
    }
  }
}
draw(); setInterval(draw, 250);
addEventListener('resize', draw);
</script>
<script src="safety.js"></script><script>Safety.start('stage');</script><!-- NIGHT SAFETY (127) -->
<script src="stagehold.js"></script><!-- #132 tap the clock: HOLD (crew code) / RESUME -->
<script src="plainwhy.js"></script><script src="moments.js"></script><script>Moments.start('stage');</script><!-- #135 MOMENTS: SPEECHES IN 12 -->
<script src="cues.js"></script><script>Cues.start('stage');</script><!-- #163 CUES: the crew's line -->
</body>
</html>
