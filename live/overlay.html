<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHOST LINK overlay</title>
<meta name="robots" content="noindex">
<style>
/* ON STREAM (#120): see-through now playing for OBS / any browser source (1920x1080 or 1280x720: everything is sized
   from the height, so both look the same). Build the address on stream.html (STATUS -> SCREENS -> STREAM OVERLAY).
   Pieces: style=lower|ticker|card|none, chip (BPM / key), prev (previously played), bar (progress / waveform). */
@font-face { font-family: "JetBrains Mono"; src: url(../JetBrainsMono_400Regular.ttf); font-weight: 400; }
@font-face { font-family: "JetBrains Mono"; src: url(../JetBrainsMono_600SemiBold.ttf); font-weight: 600; }
:root { --k: 1; --safe: 5; --sx: calc(var(--safe) * 1vw); --sy: calc(var(--safe) * 1vh);
  --fg: #fff; --grey: #a8a8a8; --air: #ff2a2a; --warn: #ffb000; }
html { font-size: calc(100vh / 67.5 * var(--k)); }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; color: var(--fg); }
body.bg-green { background: #00ff00; }
body.bg-black { background: #000; }
[hidden] { display: none !important; }

.piece { position: fixed; background: #000; transition: opacity .6s, transform .6s cubic-bezier(.2, .7, .2, 1); }
.calm .piece { transition: opacity .3s; }
.bl { left: var(--sx); bottom: var(--sy); } .br { right: var(--sx); bottom: var(--sy); }
.tl { left: var(--sx); top: var(--sy); } .tr { right: var(--sx); top: var(--sy); }

/* lower third */
#main.lower { display: grid; grid-template-columns: auto 1fr; grid-template-rows: 1fr auto; column-gap: 1.25rem;
  padding: 1rem 1.6rem 1rem 1rem; max-width: 62vw; min-width: 26rem; box-sizing: border-box; }
#main.lower.hide.bl, #main.lower.hide.tl { opacity: 0; transform: translateX(-3rem); }
#main.lower.hide.br, #main.lower.hide.tr { opacity: 0; transform: translateX(3rem); }
.calm #main.hide { transform: none !important; }
#main .names { min-width: 0; align-self: center; }
#main img { width: 5.25rem; height: 5.25rem; object-fit: cover; display: block; background: #111; align-self: center; }
#main img[hidden] + .names { grid-column: 1 / 3; }
#label { font-size: .8rem; letter-spacing: .16em; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#label::before { content: ""; display: inline-block; width: .5rem; height: .5rem; background: var(--air); margin-right: .55rem; vertical-align: .05rem; }
#title { font-size: 1.85rem; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sub { font-size: 1.25rem; color: #cfcfcf; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#meta { font-size: .85rem; color: var(--grey); letter-spacing: .08em; margin-top: .2rem; }
#bar { grid-column: 1 / 3; margin-top: .8rem; width: 0; min-width: 100%; } /* never widens the piece */
#bar.none { visibility: hidden; }
#wave { display: block; width: 100%; height: 1.9rem; }
#line { height: .3rem; background: #333; }
#line i { display: block; height: 100%; width: 0; background: var(--fg); }
#main:not(.ticker) .roller { display: none; }

/* corner ticker: one small line; scrolls only when it doesn't fit */
#main.ticker { display: flex; align-items: center; gap: .7rem; padding: .55rem .9rem; max-width: 36vw; overflow: hidden; }
#main.ticker.hide { opacity: 0; }
#main.ticker img, #main.ticker .names, #main.ticker #bar { display: none; }
#main.ticker::before { content: ""; flex: none; width: .5rem; height: .5rem; background: var(--air); }
#main.ticker .roller { overflow: hidden; min-width: 0; }
#main.ticker #tick { display: block; font-size: 1.1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#main.ticker.roll #tick { overflow: visible; text-overflow: clip; animation: roll 10s linear infinite alternate; }
@keyframes roll { 0%, 15% { transform: translateX(0); } 85%, 100% { transform: translateX(var(--over)); } }

/* big centre card */
#main.card { left: 50%; top: 50%; right: auto; bottom: auto; transform: translate(-50%, -50%); display: grid; justify-items: center;
  text-align: center; padding: 2.2rem 2.6rem; width: min(62vw, 46rem); box-sizing: border-box; }
#main.card.hide { opacity: 0; transform: translate(-50%, -46%); }
.calm #main.card.hide { transform: translate(-50%, -50%) !important; }
#main.card { grid-template-columns: minmax(0, 1fr); }
#main.card > * { grid-column: 1 !important; } /* one column, stacked */
#main.card img { width: 15rem; height: 15rem; margin-bottom: 1.4rem; }
#main.card .names { width: 100%; }
#main.card #title { font-size: 3rem; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
#main.card #sub { font-size: 1.8rem; margin-top: .3rem; }
#main.card #label { font-size: .95rem; margin-bottom: .7rem; }
#main.card #meta { font-size: 1.05rem; margin-top: .7rem; }
#main.card #bar { width: 100%; margin-top: 1.3rem; }

/* BPM / key chip */
#chip { font-size: 1.15rem; font-weight: 600; padding: .45rem .8rem; letter-spacing: .04em; white-space: nowrap; }

/* previously played */
#strip { position: fixed; left: var(--sx); right: var(--sx); display: flex; gap: 1.4rem; align-items: baseline; background: transparent;
  font-size: 1rem; white-space: nowrap; overflow: hidden; }
#strip.top { top: var(--sy); } #strip.bottom { bottom: var(--sy); }
#strip.room-r { right: calc(var(--sx) + 14rem); } #strip.room-l { left: calc(var(--sx) + 14rem); }
#strip.below { top: calc(var(--sy) + 10rem); } #strip.above { bottom: calc(var(--sy) + 10rem); }
#strip b { font-weight: 600; font-size: .75rem; letter-spacing: .16em; background: #000; color: var(--grey); padding: .35rem .55rem; flex: none; }
#strip span { background: #000; padding: .3rem .6rem; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
#strip span:nth-of-type(n+2) { color: #cfcfcf; }
</style>
</head>
<body data-overlay>
<div id="main" class="piece hide lower bl">
  <img id="art" alt="" hidden>
  <div class="names"><div id="label"></div><div id="title"></div><div id="sub"></div><div id="meta"></div></div>
  <div class="roller"><div id="tick"></div></div>
  <div id="bar" class="none"><canvas id="wave"></canvas><div id="line"><i></i></div></div>
</div>
<div id="chip" class="piece" hidden></div>
<div id="strip" hidden></div>
<script src="shim.js"></script>
<script src="waves.js"></script>
<script src="overlay.js"></script>
<script src="safety.js"></script><script>Safety.start('hide');</script><!-- NIGHT SAFETY (127): the stream overlay goes blank during SHOW STOP -->
</body>
</html>
